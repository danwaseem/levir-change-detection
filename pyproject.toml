[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levir-cd"
version = "0.1.0"
description = "LEVIR-CD building change detection experiments for DATA 255"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "Pillow",
  "torch",
]

[project.optional-dependencies]
dev = ["jupyterlab", "ipykernel", "pytest"]

[project.scripts]
levir-smoke = "levir_cd.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
